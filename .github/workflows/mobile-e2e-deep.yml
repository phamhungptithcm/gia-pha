name: CI - Mobile E2E Deep

on:
  push:
    branches:
      - staging
      - main
    paths:
      - "mobile/befam/**"
      - "scripts/prepare_android_emulator_ci.sh"
      - "scripts/run_mobile_e2e.sh"
      - ".github/workflows/mobile-e2e.yml"
      - ".github/workflows/mobile-e2e-ios.yml"
      - ".github/workflows/mobile-e2e-deep.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-deep-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deep-android-debug-full:
    name: Deep E2E - Android Debug Full
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip Android deep E2E
        run: |
          echo "::notice::Android deep mobile E2E is intentionally skipped for CI/CD."
          echo "::notice::Manual device/simulator E2E should be run before release approval."

  deep-ios-debug-full:
    name: Deep E2E - iOS Debug Full
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip iOS deep E2E
        run: |
          echo "::notice::iOS deep mobile E2E is intentionally skipped for CI/CD."
          echo "::notice::Manual device/simulator E2E should be run before release approval."

  deep-android-live-full:
    name: Deep E2E - Android Live Full
    if: ${{ vars.BEFAM_E2E_LIVE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging
    steps:
      - name: Skip Android live E2E
        run: |
          echo "::notice::Android live mobile E2E is intentionally skipped for CI/CD."
          echo "::notice::Manual device/simulator E2E should be run before release approval."
