name: CI - Mobile E2E iOS

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-ios-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    name: E2E - iOS Test Run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip iOS E2E
        run: |
          echo "::notice::iOS mobile E2E is intentionally skipped for CI/CD."
          echo "::notice::Manual device/simulator E2E should be run before release approval."
