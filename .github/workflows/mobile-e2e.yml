name: CI - Mobile E2E Android

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-android-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: E2E - Android Test Run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip Android E2E
        run: |
          echo "::notice::Android mobile E2E is intentionally skipped for CI/CD."
          echo "::notice::Manual device/simulator E2E should be run before release approval."
